<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">

        <div class="header">
                <h1> School Management System</h1>
        </div>

        <div class="main">

            <div class="card-container">



                <div class="card">
                    <span >Passed students</span>
                    <h2 id="passed" style="color: green;">0</h2>
                    <span id="totalpassed"> % of total student</span>
                </div>

                <div class="card">
                    <span> Failed students</span>
                    <h2 id="failed" style="color: red;">0</h2>
                    <span id="totalfailed"> % of total student</span>
                </div>

                <div class="card">
                    <span>total students</span>
                    <h2 id="total">0</h2>
                    
                </div>

            </div>


            <div class="boxes">

                <div class="box-data">
                    <span>Student datas</span>
                    <table>
                        <thead>
                            <tr>
                                <th>Student Number</th>
                                <th>Name</th>
                                <th>Course</th>
                                <th>Section</th>
                                <th>Grade</th>
                                <th>Remarks</th>
                                <th>Update</th>
                                <th>Delete</th>
                            </tr>
                        </thead>

                        <tbody id="tbody"></tbody>
                    </table>
                </div>


                <div class="box-form">
                    <span>Student Information</span>
                    <form>
                        <input type="number" name="" id="studNum" placeholder="Enter student Number" required>
                        <input type="text" name="" id="sName" placeholder="Enter Student name"  required>
                        <input type="text" name="" id="sCourse" placeholder="Enter Course"  required>
                        <input type="text" name="" id="sSection" placeholder="Enter Section"  required>
                        <input type="number" name="" id="sGrade" placeholder="Enter Grade"  required>
                        
                        <button id="submitbtn">Sumbmit</button>
                    </form>
                </div>

            </div>



        </div>














    </div>


    <script src="index.js"> </script>
</body>
</html>
