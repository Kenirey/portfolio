<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
 
  <style>
    /* ===== RESET ===== */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ===== VARIABLES ===== */
:root {
  --bg: #f5f5f0;
  --surface: #ffffff;
  --border: #e8e8e2;
  --text-primary: #1a1a18;
  --text-secondary: #6b6b65;
  --text-muted: #9f9f99;
  --accent: #1a1a18;
  --blue: #2563eb;
  --blue-light: #eff6ff;
  --green: #16a34a;
  --green-light: #f0fdf4;
  --amber: #d97706;
  --amber-light: #fffbeb;
  --purple: #7c3aed;
  --purple-light: #f5f3ff;
  --red: #dc2626;
  --red-light: #fef2f2;
  --sidebar-w: 220px;
  --radius: 10px;
  --radius-sm: 6px;
}

/* ===== BASE ===== */
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ===== LAYOUT ===== */
.layout {
  display: flex;
  min-height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-w);
  background: var(--text-primary);
  display: flex;
  flex-direction: column;
  padding: 24px 0;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px 28px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  color: white;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: -0.3px;
}

.brand-icon {
  width: 32px;
  height: 32px;
  background: white;
  color: var(--text-primary);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 20px 12px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: rgba(255,255,255,0.55);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 400;
  transition: all 0.15s;
}

.nav-item:hover {
  background: rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.85);
}

.nav-item.active {
  background: rgba(255,255,255,0.12);
  color: white;
  font-weight: 500;
}

/* ===== MAIN ===== */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* ===== TOPBAR ===== */
.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.page-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.5px;
  color: var(--text-primary);
}

.page-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}

.btn-add {
  background: var(--text-primary);
  color: white;
  border: none;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.15s;
  white-space: nowrap;
}

.btn-add:hover { opacity: 0.8; }

/* ===== CARDS ===== */
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.card-label {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.card-value {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.5px;
  font-family: 'DM Mono', monospace;
}

.card-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 99px;
  font-weight: 500;
  width: fit-content;
}

.tag-blue  { background: var(--blue-light);   color: var(--blue);   }
.tag-green { background: var(--green-light);  color: var(--green);  }
.tag-amber { background: var(--amber-light);  color: var(--amber);  }
.tag-purple{ background: var(--purple-light); color: var(--purple); }

/* ===== TABLE SECTION ===== */
.table-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.table-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.table-title {
  font-size: 14px;
  font-weight: 600;
}

.search-input {
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  background: var(--bg);
  color: var(--text-primary);
  width: 240px;
  outline: none;
  transition: border-color 0.15s;
}

.search-input:focus { border-color: var(--text-primary); }

.table-wrapper {
  overflow-x: auto;
  max-height: 400px;
  overflow-y: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
}

th {
  padding: 11px 16px;
  text-align: left;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

td {
  padding: 12px 16px;
  font-size: 13.5px;
  border-bottom: 1px solid var(--border);
  color: var(--text-primary);
}

tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg); }

/* ===== BADGES ===== */
.badge {
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 500;
}

.badge-in    { background: var(--green-light); color: var(--green); }
.badge-low   { background: var(--amber-light); color: var(--amber); }
.badge-out   { background: var(--red-light);   color: var(--red);   }

/* ===== ACTION BUTTONS ===== */
.action-btn {
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.15s;
  margin-right: 4px;
}

.action-btn:hover { background: var(--bg); color: var(--text-primary); }
.action-btn.del:hover { background: var(--red-light); color: var(--red); border-color: var(--red); }

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 48px;
  color: var(--text-muted);
  font-size: 13px;
  display: none;
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border-radius: var(--radius);
  width: 420px;
  border: 1px solid var(--border);
  animation: slideUp 0.2s ease;
}

@keyframes slideUp {
  from { transform: translateY(16px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}

.modal-title { font-size: 15px; font-weight: 600; }

.modal-close {
  background: none;
  border: none;
  font-size: 14px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
}

.modal-close:hover { background: var(--bg); color: var(--text-primary); }

.modal-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-group label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
}

.form-group input,
.form-group select {
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  background: var(--surface);
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.15s;
}

.form-group input:focus,
.form-group select:focus { border-color: var(--text-primary); }

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  padding-top: 4px;
}

.btn-cancel {
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  cursor: pointer;
  color: var(--text-secondary);
}

.btn-cancel:hover { background: var(--bg); }

.btn-submit {
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--text-primary);
  color: white;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.15s;
}

.btn-submit:hover { opacity: 0.8; }

/* ===== MONO ===== */
.mono {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px) {
  .cards { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 20px; }
  .cards { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 480px) {
  .cards { grid-template-columns: 1fr; }
  .topbar { flex-direction: column; gap: 12px; }
  .search-input { width: 100%; }
}
  </style>
</head>
<body>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">IV</div>
        <span>Inventra</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="#" class="nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          Products
        </a>
        <a href="#" class="nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Reports
        </a>
        <a href="#" class="nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14"/><path d="M4.93 4.93a10 10 0 000 14.14"/></svg>
          Settings
        </a>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- TOP BAR -->
      <div class="topbar">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-sub">Track and manage your inventory</p>
        </div>
        <button class="btn-add" onclick="openModal()">+ Add Product</button>
      </div>

      <!-- CARDS -->
      <div class="cards">
        <div class="card">
          <span class="card-label">Total Products</span>
          <h2 class="card-value" id="totalProducts">0</h2>
          <span class="card-tag tag-blue">All items</span>
        </div>
        <div class="card">
          <span class="card-label">In Stock</span>
          <h2 class="card-value" id="inStock">0</h2>
          <span class="card-tag tag-green">qty &gt; 5</span>
        </div>
        <div class="card">
          <span class="card-label">Low Stock</span>
          <h2 class="card-value" id="lowStock">0</h2>
          <span class="card-tag tag-amber">qty 1–5</span>
        </div>
        <div class="card">
          <span class="card-label">Total Value</span>
          <h2 class="card-value" id="totalValue">₱0</h2>
          <span class="card-tag tag-purple">price × qty</span>
        </div>
      </div>

      <!-- SEARCH + TABLE -->
      <div class="table-section">
        <div class="table-topbar">
          <span class="table-title">Product List</span>
          <input type="text" class="search-input" placeholder="Search product or category..." oninput="searchProducts(this.value)" />
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div id="emptyState" class="empty-state">No products yet. Add one!</div>
        </div>
      </div>

    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Add Product</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="pName" placeholder="e.g. Laptop" />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="pCategory">
            <option value="">Select category</option>
            <option>Electronics</option>
            <option>Supplies</option>
            <option>Food</option>
            <option>Clothing</option>
            <option>Tools</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Price (₱)</label>
            <input type="number" id="pPrice" placeholder="0" min="0" />
          </div>
          <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="pQty" placeholder="0" min="0" />
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn-submit" id="submitBtn" onclick="submitProduct()">Add Product</button>
        </div>
      </div>
    </div>
  </div>

  <script>
let products = []
let editIndex = null

// ===== RENDER =====
function renderTable(data = products) {
  const tbody = document.getElementById('tbody')
  const empty = document.getElementById('emptyState')

  if (data.length === 0) {
    tbody.innerHTML = ''
    empty.style.display = 'block'
    return
  }

  empty.style.display = 'none'

  tbody.innerHTML = data.map((p, i) => {
    const realIndex = products.indexOf(p)
    const status = p.qty === 0
      ? '<span class="badge badge-out">Out of Stock</span>'
      : p.qty <= 5
        ? '<span class="badge badge-low">Low Stock</span>'
        : '<span class="badge badge-in">In Stock</span>'

    return `
      <tr>
        <td class="mono" style="color:var(--text-muted)">${String(i + 1).padStart(2, '0')}</td>
        <td style="font-weight:500">${p.name}</td>
        <td style="color:var(--text-secondary)">${p.category}</td>
        <td class="mono">₱${Number(p.price).toLocaleString()}</td>
        <td class="mono">${p.qty}</td>
        <td>${status}</td>
        <td>
          <button class="action-btn" onclick="editProduct(${realIndex})">Edit</button>
          <button class="action-btn del" onclick="deleteProduct(${realIndex})">Delete</button>
        </td>
      </tr>
    `
  }).join('')
}

// ===== UPDATE CARDS =====
function updateCards() {
  const total = products.length
  const inStock = products.filter(p => p.qty > 5).length
  const lowStock = products.filter(p => p.qty >= 1 && p.qty <= 5).length
  const totalValue = products.reduce((sum, p) => sum + (p.price * p.qty), 0)

  document.getElementById('totalProducts').textContent = total
  document.getElementById('inStock').textContent = inStock
  document.getElementById('lowStock').textContent = lowStock
  document.getElementById('totalValue').textContent = '₱' + totalValue.toLocaleString()
}

// ===== ADD / EDIT PRODUCT =====
function submitProduct() {
  const name     = document.getElementById('pName').value.trim()
  const category = document.getElementById('pCategory').value
  const price    = parseFloat(document.getElementById('pPrice').value)
  const qty      = parseInt(document.getElementById('pQty').value)

  if (!name || !category || isNaN(price) || isNaN(qty)) {
    alert('Please fill up all fields!')
    return
  }

  if (editIndex !== null) {
    products[editIndex] = { name, category, price, qty }
    editIndex = null
  } else {
    products.push({ name, category, price, qty })
  }

  renderTable()
  updateCards()
  closeModal()
}

// ===== DELETE =====
function deleteProduct(index) {
  if (!confirm(`Delete "${products[index].name}"?`)) return
  products.splice(index, 1)
  renderTable()
  updateCards()
}

// ===== EDIT =====
function editProduct(index) {
  const p = products[index]
  editIndex = index

  document.getElementById('pName').value     = p.name
  document.getElementById('pCategory').value = p.category
  document.getElementById('pPrice').value    = p.price
  document.getElementById('pQty').value      = p.qty

  document.getElementById('modalTitle').textContent  = 'Edit Product'
  document.getElementById('submitBtn').textContent   = 'Save Changes'

  openModal()
}

// ===== SEARCH =====
function searchProducts(query) {
  const q = query.toLowerCase()
  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.category.toLowerCase().includes(q)
  )
  renderTable(filtered)
}

// ===== MODAL =====
function openModal() {
  document.getElementById('modalOverlay').classList.add('open')
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return
  document.getElementById('modalOverlay').classList.remove('open')

  document.getElementById('pName').value     = ''
  document.getElementById('pCategory').value = ''
  document.getElementById('pPrice').value    = ''
  document.getElementById('pQty').value      = ''
  document.getElementById('modalTitle').textContent = 'Add Product'
  document.getElementById('submitBtn').textContent  = 'Add Product'
  editIndex = null
}

// ===== INIT =====
renderTable()
updateCards()




  </script>
</body>
</html>
