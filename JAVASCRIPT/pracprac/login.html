<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container">

        <div class="login-container">

            <div class="welcome">

                <h1>Welcome!</h1>
                <p>Have a great day</p>

            </div>

            <form class="form-container">
            
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Username"  class="form" required>
               
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="password" class="form"  required>
                
                <div>
                
                <input type="checkbox" id="check">
                <label for="check">Remember me</label>
                </div>

                <button class="signin">Sign In</button>

                <span>Don't have account yet? <a href="" class="signup">Sign Up</a></span>
                <a href="" class="forgot">Forgot Passwrod?</a>

            </form>




        </div>



    </div>






    
</body>
</html>
