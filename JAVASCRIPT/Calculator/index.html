<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
 
    <div class="container">
        <div class="card">
            <h1 class="title">Tip Calculator</h1>
 
            <div class="input-group">
                <label for="bill">Bill Amount (₱)</label>
                <input type="number" id="bill" placeholder="0.00">
            </div>
 
            <div class="tip-group">
                <label>Select Tip</label>
                <div class="tip-buttons">
                    <button class="tip-btn" onclick="computeTip(10)">10%</button>
                    <button class="tip-btn" onclick="computeTip(15)">15%</button>
                    <button class="tip-btn" onclick="computeTip(20)">20%</button>
                </div>
            </div>
 
            <div class="result" id="result" style="display:none;">
                <div class="result-row">
                    <span>Tip Amount</span>
                    <span id="tipAmount">₱0.00</span>
                </div>
                <div class="divider"></div>
                <div class="result-row total">
                    <span>Total Bill</span>
                    <span id="totalAmount">₱0.00</span>
                </div>
            </div>
        </div>
    </div>
 
    <script src="index.js"></script>
</body>
</html>
