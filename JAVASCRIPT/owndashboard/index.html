<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container" id="container">

        <div class="sidebar" >

            <div class="head">Grade App</div>
            
            <div class="links">

                <a href="" class="link">Dashboard</a>
                <a href="" class="link">Students</a>
                <a href="" class="link">Reports</a>
                <a href="" class="link">Settings</a>
                

            </div>
            <div class="switch">
            <button id="light">change</button>
        </div>
            <div class="logout">
                <a href="">Logout</a>
            </div>

        </div>


        <div class="main">

            <div class="header">

                <h1>Dashboard</h1>

            </div>

        

            <div class="cards">

                <div class="card">
                    <p class="title">Total Student </p>
                    <h2>128</h2>
                    <span style="color: yellowgreen;">+12 This month</span>
                </div>

                <div class="card">
                    <p class="title"> Passed</p>
                    <h2>104</h2>
                    <span style="color: greenyellow;">81% pass rate</span>
                </div>

                <div class="card">
                    <p class="title">Failed </p>
                    <h2 style="color: red;"> 24 </h2>
                    <span style="color: red;">19% failed reate</span>
                </div>


            </div>






            <div class="table-container">

                <div class="table-header">Recent Student</div>

                <table>
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Grade</th>
                        <th>Remark</th>
                    </tr>
                </thead>

                    <tbody>
                        <tr>
                            <td>Ken</td>
                            <td>BSIT</td>
                            <td>1.75</td>
                            <td><p class="passed">Passed</p></td>
                        </tr>
                        <tr>
                            <td>Nek</td>
                            <td>BSTM</td>
                            <td>1.25</td>
                            <td><p class="passed">Passed</p></td>
                        </tr>
                        <tr>
                            <td>Jane</td>
                            <td>BSIS</td>
                            <td>5.00</td>
                            <td ><p class="failed">Failed</p></td>
                        </tr>


                    </tbody>



                </table>



            </div>

        </div>



    </div>





    <script src="index.js"></script>
</body>
</html>
